name: Compilar Black para iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: 1. Baixar o código do repositório
      uses: actions/checkout@v4

    - name: 2. Organizar Pasta do Executável do Xbox
      run: |
        mkdir -p assets
        mv default.xbe assets/default.xbe || true

    - name: 3. Executar Scripts Preparatórios
      run: |
        chmod +x scripts/*.sh
        ./scripts/fetch-deps.sh ios
        ./scripts/build-apple.sh
        ./scripts/apply-sdk-patches.sh

    - name: 4. Gerar o projeto do Xcode via CMake
      run: |
        TOOLCHAIN_PATH=$(find . -name "ios.toolchain.cmake" -print -quit)
        echo "Arquivo de configuração encontrado em: $TOOLCHAIN_PATH"
        
        cmake -B build -G Xcode \
          -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_PATH" \
          -DPLATFORM=OS64COMBINED \
          -DMOLTENVK_DIR=third_party/MoltenVK-ios

    - name: 5. Compilar o Jogo
      run: |
        cmake --build build --config Release

    - name: 6. Empacotar o Jogo em Formato .ipa
      run: |
        mkdir -p Payload
        cp -R build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -R build/*.app Payload/ 2>/dev/null || true
        zip -r BlackJogo.ipa Payload
        
    - name: 7. Disponibilizar o arquivo IPA para Download
      uses: actions/upload-artifact@v4
      with:
        name: jogo-black-ios
        path: BlackJogo.ipa
