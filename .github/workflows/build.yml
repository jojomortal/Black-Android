name: Compilar Black para iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: 1. Baixar o código do repositório
      uses: actions/checkout@v4

    - name: 2. Organizar Pasta do Executável do Xbox
      run: |
        mkdir -p assets
        mv default.xbe assets/default.xbe || true

    - name: 3. Executar Scripts Preparatórios
      run: |
        chmod +x scripts/*.sh
        ./scripts/fetch-deps.sh ios
        ./scripts/build-apple.sh
        ./scripts/apply-sdk-patches.sh

    - name: 4. Injetar Marca D'água JOJOMORTAL, Espelhamento e Mods
      run: |
        find . -name "*Info.plist*" | while read PLIST_FILE; do
          echo "Injetando assinatura de autoria e visibilidade em: $PLIST_FILE"
          # Permite que a pasta apareça no app Arquivos nativo imediatamente
          plutil -insert UIFileSharingEnabled -bool true "$PLIST_FILE" 2>/dev/null || true
          plutil -insert LSSupportsOpeningDocumentsInPlace -bool true "$PLIST_FILE" 2>/dev/null || true
          
          # Desativa o modo de duas janelas que crashava a TV via HDMI
          plutil -remove UISupportsExternalDisplays "$PLIST_FILE" 2>/dev/null || true
          plutil -insert UISupportsExternalDisplays -bool false "$PLIST_FILE" 2>/dev/null || true
          
          # Injeta a sua assinatura digital e créditos de autoria nos metadados do aplicativo
          plutil -insert NSHumanReadableCopyright -string "Compilado e Turbinado por JOJOMORTAL" "$PLIST_FILE" 2>/dev/null || true
          plutil -insert CFBundleGetInfoString -string "Launcher Black iOS - Customizado por JOJOMORTAL" "$PLIST_FILE" 2>/dev/null || true
        done

    - name: 5. Gerar o projeto do Xcode com Otimização Máxima
      run: |
        MVK_FILE=$(find . -name "libMoltenVK.a" -print -quit)
        if [ ! -z "$MVK_FILE" ]; then
          cp "$MVK_FILE" .
        fi

        VULKAN_INCLUDE_DIR=$(find . -path "*/vulkan/vulkan.h" -print -quit | sed 's/\/vulkan\/vulkan.h//')
        TOOLCHAIN_PATH=$(find . -name "ios.toolchain.cmake" -print -quit)
        
        cmake -B build -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
          -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_PATH" \
          -DPLATFORM=OS64 \
          -DENABLE_BITCODE=OFF \
          -DCMAKE_LIBRARY_PATH=. \
          -DCMAKE_INCLUDE_PATH="$VULKAN_INCLUDE_DIR" \
          -DCMAKE_CXX_FLAGS="-O3 -flto -DMAX_FPS=120" \
          -DCMAKE_C_FLAGS="-O3 -flto -DMAX_FPS=120"

    - name: 6. Compilar o Jogo
      run: |
        cmake --build build --config Release --target main

    - name: 7. Empacotar o Jogo em Formato .ipa Estruturado
      run: |
        mkdir -p Payload
        cp -R build/Release-iphoneos/main.app Payload/ 2>/dev/null || cp -R build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -R build/*.app Payload/ 2>/dev/null || true
        
        # Localiza o aplicativo e injeta o arquivo inicial que força a pasta a aparecer no app Arquivos
        TARGET_APP=$(find Payload -name "*.app" -print -quit)
        mkdir -p "$TARGET_APP/Documents"
        echo "Launcher customizado e otimizado por JOJOMORTAL. Insira a sua ISO de Xbox aqui!" > "$TARGET_APP/Documents/AUTORIA_JOJOMORTAL.txt"
        
        zip -r BlackJogo.ipa Payload

    - name: 8. Disponibilizar o arquivo IPA Pro para Download
      uses: actions/upload-artifact@v4
      with:
        name: jogo-black-ios-jojomortal
        path: BlackJogo.ipa
